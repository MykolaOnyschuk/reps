<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100-Day Challenge Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f0f0f;
            --secondary: #1a1a1a;
            --accent: #00d9ff;
            --accent-alt: #ff006e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #2a2a2a;
            --success: #00ff41;
            --warning: #ffa500;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--primary) 0%, #1a0f2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--secondary);
            border-bottom: 2px solid var(--accent);
            padding: 2rem;
            text-align: center;
            animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* User Selector */
        .user-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s 0.2s both;
        }

        .user-btn {
            padding: 1.5rem;
            border: 2px solid var(--border);
            background: var(--secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .user-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            z-index: -1;
            transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .user-btn:hover {
            border-color: var(--accent);
            color: var(--primary);
        }

        .user-btn:hover::before {
            left: 0;
        }

        .user-btn.active {
            background: var(--accent);
            color: var(--primary);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }

        .user-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Main Content Grid */
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s 0.4s both;
        }

        /* Log Card */
        .log-card {
            background: var(--secondary);
            border: 2px solid var(--border);
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .log-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .log-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .exercise-group {
            margin-bottom: 2rem;
        }

        .exercise-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .exercise-name {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .exercise-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .exercise-count {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .exercise-count.complete {
            color: var(--success);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            margin-bottom: 1rem;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-alt));
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .input-group {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .reps-input {
            flex: 1;
            padding: 0.8rem;
            background: var(--primary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .reps-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .btn-log {
            padding: 0.8rem 1.5rem;
            background: var(--accent);
            color: var(--primary);
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.9rem;
        }

        .btn-log:hover {
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-log:active {
            transform: translateY(0);
        }

        /* Stats Card */
        .stats-card {
            background: var(--secondary);
            border: 2px solid var(--border);
            padding: 2rem;
        }

        .stats-card h2 {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-value.complete {
            color: var(--success);
        }

        /* Calendar View */
        .calendar-section {
            grid-column: 1 / -1;
            background: var(--secondary);
            border: 2px solid var(--border);
            padding: 2rem;
            animation: fadeIn 0.8s 0.6s both;
        }

        .calendar-section h2 {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 0.5rem;
        }

        .day-cell {
            aspect-ratio: 1;
            background: var(--primary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .day-cell:hover {
            border-color: var(--accent);
        }

        .day-cell.completed {
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            color: var(--primary);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }

        .day-cell.partial {
            background: var(--warning);
            color: var(--primary);
            border-color: var(--warning);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .calendar-grid {
                grid-template-columns: repeat(10, 1fr);
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .user-selector {
                grid-template-columns: 1fr;
            }

            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 0;
            border: 2px solid var(--success);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>100-DAY CHALLENGE</h1>
        <p>Pushups • Situps • Crawls</p>
    </div>

    <div class="container">
        <div class="user-selector">
            <button class="user-btn active" data-user="user1">
                <span class="user-icon">💪</span>
                User 1
            </button>
            <button class="user-btn" data-user="user2">
                <span class="user-icon">🏋️</span>
                User 2
            </button>
            <button class="user-btn" data-user="user3">
                <span class="user-icon">🔥</span>
                User 3
            </button>
        </div>

        <div class="content">
            <div class="log-card">
                <h2>Today's Log</h2>
                
                <div class="exercise-group">
                    <div class="exercise-label">
                        <span class="exercise-name">Pushups</span>
                        <span class="exercise-progress">
                            <span class="exercise-count" id="pushups-count">0</span>
                            <span style="color: var(--text-secondary);">/ 100</span>
                        </span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="pushups-bar" style="width: 0%"></div>
                    </div>
                    <div class="input-group">
                        <input type="number" class="reps-input" id="pushups-input" placeholder="Enter reps" min="0">
                        <button class="btn-log" onclick="logExercise('pushups')">Log</button>
                    </div>
                </div>

                <div class="exercise-group">
                    <div class="exercise-label">
                        <span class="exercise-name">Situps</span>
                        <span class="exercise-progress">
                            <span class="exercise-count" id="situps-count">0</span>
                            <span style="color: var(--text-secondary);">/ 100</span>
                        </span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="situps-bar" style="width: 0%"></div>
                    </div>
                    <div class="input-group">
                        <input type="number" class="reps-input" id="situps-input" placeholder="Enter reps" min="0">
                        <button class="btn-log" onclick="logExercise('situps')">Log</button>
                    </div>
                </div>

                <div class="exercise-group">
                    <div class="exercise-label">
                        <span class="exercise-name">Crawls</span>
                        <span class="exercise-progress">
                            <span class="exercise-count" id="crawls-count">0</span>
                            <span style="color: var(--text-secondary);">/ 100</span>
                        </span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="crawls-bar" style="width: 0%"></div>
                    </div>
                    <div class="input-group">
                        <input type="number" class="reps-input" id="crawls-input" placeholder="Enter reps" min="0">
                        <button class="btn-log" onclick="logExercise('crawls')">Log</button>
                    </div>
                </div>
            </div>

            <div class="stats-card">
                <h2>Today's Stats</h2>
                <div class="stat-item">
                    <span class="stat-label">Pushups</span>
                    <span class="stat-value" id="stat-pushups">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Situps</span>
                    <span class="stat-value" id="stat-situps">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Crawls</span>
                    <span class="stat-value" id="stat-crawls">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Day Streak</span>
                    <span class="stat-value" id="stat-streak">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Days</span>
                    <span class="stat-value" id="stat-days">0</span>
                </div>
            </div>

            <div class="calendar-section">
                <h2>100-Day Calendar</h2>
                <div class="calendar-grid" id="calendar"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STATE & STORAGE
        // ============================================
        let currentUser = 'user1';
        const GOAL = 100;
        const TOTAL_DAYS = 100;

        // Initialize local storage
        function initStorage() {
            const users = ['user1', 'user2', 'user3'];
            users.forEach(user => {
                if (!localStorage.getItem(user)) {
                    localStorage.setItem(user, JSON.stringify({}));
                }
            });
        }

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function getUserData(user = currentUser) {
            const data = localStorage.getItem(user);
            return data ? JSON.parse(data) : {};
        }

        function saveUserData(data, user = currentUser) {
            localStorage.setItem(user, JSON.stringify(data));
            // TODO: Send to backend API
            // await fetch('/api/log', { method: 'POST', body: JSON.stringify({ user, data }) })
        }

        function getTodayData(user = currentUser) {
            const userData = getUserData(user);
            const today = getTodayKey();
            return userData[today] || { pushups: 0, situps: 0, crawls: 0 };
        }

        function saveTodayData(data, user = currentUser) {
            const userData = getUserData(user);
            userData[getTodayKey()] = data;
            saveUserData(userData, user);
        }

        // ============================================
        // UI UPDATES
        // ============================================
        function updateUI() {
            const today = getTodayData();

            // Update progress bars and counts
            updateExerciseUI('pushups', today.pushups);
            updateExerciseUI('situps', today.situps);
            updateExerciseUI('crawls', today.crawls);

            // Update stats
            updateStats(today);

            // Update calendar
            updateCalendar();

            // Clear inputs
            document.getElementById('pushups-input').value = '';
            document.getElementById('situps-input').value = '';
            document.getElementById('crawls-input').value = '';
        }

        function updateExerciseUI(exercise, reps) {
            const percent = (reps / GOAL) * 100;
            const countElement = document.getElementById(`${exercise}-count`);
            const barElement = document.getElementById(`${exercise}-bar`);

            countElement.textContent = reps;
            barElement.style.width = Math.min(percent, 100) + '%';

            if (reps >= GOAL) {
                countElement.classList.add('complete');
            } else {
                countElement.classList.remove('complete');
            }
        }

        function updateStats(today) {
            const pushupPercent = Math.round((today.pushups / GOAL) * 100);
            const situpsPercent = Math.round((today.situps / GOAL) * 100);
            const crawlsPercent = Math.round((today.crawls / GOAL) * 100);

            document.getElementById('stat-pushups').textContent = Math.min(pushupPercent, 100) + '%';
            document.getElementById('stat-situps').textContent = Math.min(situpsPercent, 100) + '%';
            document.getElementById('stat-crawls').textContent = Math.min(crawlsPercent, 100) + '%';

            const userData = getUserData();
            const daysActive = Object.keys(userData).length;
            document.getElementById('stat-days').textContent = daysActive;

            // Calculate streak
            let streak = 0;
            let checkDate = new Date();
            for (let i = 0; i < TOTAL_DAYS; i++) {
                const dateStr = checkDate.toISOString().split('T')[0];
                const dayData = userData[dateStr];
                if (dayData && dayData.pushups > 0 && dayData.situps > 0 && dayData.crawls > 0) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            document.getElementById('stat-streak').textContent = streak;
        }

        function updateCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            const userData = getUserData();

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.textContent = i;

                // Check if this day has been logged (simulate day offset)
                const checkDate = new Date();
                checkDate.setDate(checkDate.getDate() - (TOTAL_DAYS - i));
                const dateStr = checkDate.toISOString().split('T')[0];
                const dayData = userData[dateStr];

                if (dayData) {
                    const allComplete = dayData.pushups >= GOAL && dayData.situps >= GOAL && dayData.crawls >= GOAL;
                    const anyLogged = dayData.pushups > 0 || dayData.situps > 0 || dayData.crawls > 0;

                    if (allComplete) {
                        cell.classList.add('completed');
                    } else if (anyLogged) {
                        cell.classList.add('partial');
                    }
                }

                calendar.appendChild(cell);
            }
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        function logExercise(exercise) {
            const input = document.getElementById(`${exercise}-input`);
            const reps = parseInt(input.value) || 0;

            if (reps < 0) {
                alert('Please enter a valid number');
                return;
            }

            const today = getTodayData();
            today[exercise] = reps;
            saveTodayData(today);

            // Show toast
            showToast(`${exercise.charAt(0).toUpperCase() + exercise.slice(1)} logged: ${reps} reps`);

            updateUI();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // User selector
        document.querySelectorAll('.user-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentUser = this.dataset.user;
                updateUI();
            });
        });

        // Enter key to log
        document.querySelectorAll('.reps-input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const exercise = this.id.replace('-input', '');
                    logExercise(exercise);
                }
            });
        });

        // Initialize
        initStorage();
        updateUI();
    </script>
</body>
</html>
