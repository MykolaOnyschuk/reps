<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100-Day Fitness Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .user-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #ddd; }
        button.active { background: var(--primary); color: white; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .day { aspect-ratio: 1; border: 1px solid #eee; padding: 5px; font-size: 12px; position: relative; cursor: pointer; }
        .day:hover { background: #f0f7ff; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 2px; }
        .complete { background: #22c55e; }
        .partial { background: #eab308; }
        .empty { background: #e2e8f0; }
        /* Modal Styles */
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 100; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>100-Day Tracker</h1>
        <p id="current-user-display">Selecting User...</p>
    </div>

    <div class="user-selector">
        <button onclick="setUser('oleg')" id="btn-oleg">Oleg</button>
        <button onclick="setUser('slavic')" id="btn-slavic">Slavic</button>
        <button onclick="setUser('kolya')" id="btn-kolya">Kolya</button>
    </div>

    <div id="calendar" class="calendar"></div>
</div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="modal">
    <h3 id="modal-date-title">Log Data</h3>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <label>Pushups: <input type="number" id="input-pushups" value="0"></label>
        <label>Situps: <input type="number" id="input-situps" value="0"></label>
        <label>Crawls: <input type="number" id="input-crawls" value="0"></label>
        <button onclick="saveData()" style="background: var(--primary); color: white;">Save to Cloud</button>
    </div>
</div>

<script>
    // 1. CONFIGURATION
    const SB_URL = "https://tzpobmqqcywoswqkmjtw.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cG9ibXFxY3l3b3N3cWttanR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTczMTAsImV4cCI6MjA5MjA5MzMxMH0.N-Iu-RHDYSZ9WG_Q_ShjclD5n4M9PMz6ff1WzVJ6Aac";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = 'oleg';
    let selectedDate = '';
    let fitnessData = { oleg: {}, slavic: {}, kolya: {} };

    // 2. INITIALIZATION
    async function init() {
        setUser('oleg');
        await fetchAllData(); // Load initial state
        subscribeToChanges(); // Turn on Real-time
    }

    function setUser(user) {
        currentUser = user;
        document.querySelectorAll('.user-selector button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${user}`).classList.add('active');
        document.getElementById('current-user-display').innerText = `Current User: ${user.toUpperCase()}`;
        renderCalendar();
    }

    // 3. CORE SYNC LOGIC (The Fix)
    async function fetchAllData() {
        const { data, error } = await _supabase.from('logs').select('*');
        if (error) return console.error("Error fetching:", error);

        // Reset local data structure
        fitnessData = { oleg: {}, slavic: {}, kolya: {} };
        
        // Map DB rows to our local object
        data.forEach(row => {
            if (!fitnessData[row.user_id][row.date]) {
                fitnessData[row.user_id][row.date] = { pushups: 0, situps: 0, crawls: 0 };
            }
            fitnessData[row.user_id][row.date][row.exercise] = row.reps;
        });

        localStorage.setItem('fitnessData', JSON.stringify(fitnessData));
        renderCalendar();
    }

    async function saveData() {
        const pushups = parseInt(document.getElementById('input-pushups').value) || 0;
        const situps = parseInt(document.getElementById('input-situps').value) || 0;
        const crawls = parseInt(document.getElementById('input-crawls').value) || 0;

        const exercises = [
            { name: 'pushups', val: pushups },
            { name: 'situps', val: situps },
            { name: 'crawls', val: crawls }
        ];

        // Prepare batch upsert
        const updates = exercises.map(ex => ({
            user_id: currentUser,
            date: selectedDate,
            exercise: ex.name,
            reps: ex.val
        }));

        const { error } = await _supabase.from('logs').upsert(updates, { onConflict: 'user_id, date, exercise' });

        if (error) {
            alert("Error saving: " + error.message);
        } else {
            closeModal();
            // No need to manually render; the subscription handles it!
        }
    }

    // 4. REAL-TIME SUBSCRIPTION
    function subscribeToChanges() {
        _supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'logs' }, (payload) => {
                console.log('Change received, syncing...');
                fetchAllData(); 
            })
            .subscribe();
    }

    // 5. UI RENDERING
    function renderCalendar() {
        const container = document.getElementById('calendar');
        container.innerHTML = '';
        
        // Start from April 1, 2026 for 100 days
        let start = new Date('2026-04-01T12:00:00');
        
        for (let i = 0; i < 100; i++) {
            let d = new Date(start);
            d.setDate(start.getDate() + i);
            let dateStr = d.toISOString().split('T')[0];
            
            const dayEl = document.createElement('div');
            dayEl.className = 'day';
            dayEl.innerHTML = `<div>${d.getDate()} ${d.toLocaleString('default', {month:'short'})}</div>`;
            
            // Add progress dots
            const userData = fitnessData[currentUser][dateStr] || {};
            ['pushups', 'situps', 'crawls'].forEach(ex => {
                const dot = document.createElement('span');
                dot.className = `status-dot ${(userData[ex] >= 100) ? 'complete' : (userData[ex] > 0 ? 'partial' : 'empty')}`;
                dayEl.appendChild(dot);
            });

            dayEl.onclick = () => openModal(dateStr);
            container.appendChild(dayEl);
        }
    }

    function openModal(date) {
        selectedDate = date;
        const data = fitnessData[currentUser][date] || { pushups: 0, situps: 0, crawls: 0 };
        document.getElementById('modal-date-title').innerText = `Log for ${date}`;
        document.getElementById('input-pushups').value = data.pushups || 0;
        document.getElementById('input-situps').value = data.situps || 0;
        document.getElementById('input-crawls').value = data.crawls || 0;
        document.getElementById('modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    init();
</script>

</body>
</html>
